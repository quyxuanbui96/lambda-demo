[tool.poetry]
name = "csv-lambda"
version = "0.1.0"
description = "CSV input processing on AWS Lambda"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.requires-plugins]
poetry-plugin-export = "1.10.1"

[tool.poetry.dependencies]
python = "~3.14.0"
boto3 = "^1.35.0"
pydantic = "^2.9.0"
aws-lambda-powertools = "^3.0.0"

[tool.poetry.group.workflow.dependencies]
sqlalchemy = "^2.0"
psycopg = { extras = ["binary"], version = "^3.2" }

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
moto = { extras = ["s3", "server"], version = "^5.0.0" }
pytest-cov = "^7.0"
black = "^26.10.0"
ruff = "^0.16.10"
mypy = "^2.4.0"
boto3-stubs = { extras = ["s3", "sqs", "secretsmanager"], version = "^1.35.0" }
python-dotenv = "^1.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -m 'not integration'"
markers = ["integration: requires local HTTP sockets or a dedicated PostgreSQL test instance"]

[tool.black]
line-length = 100
target-version = ["py314"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "scripts"]
mypy_path = "."
explicit_package_bases = true

[tool.poetry]
name = "csv-lambda"
version = "0.1.0"
description = "CSV input processing on AWS Lambda"
authors = []
readme = "README.md"
package-mode = false

[tool.poetry.requires-plugins]
poetry-plugin-export = "1.9.0"

[tool.poetry.dependencies]
python = "~3.11"
boto3 = "^1.35.0"
pydantic = "^2.9.0"
aws-lambda-powertools = "^3.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
moto = { extras = ["s3"], version = "^5.0.0" }
black = "^24.8.0"
ruff = "^0.6.0"
mypy = "^1.11.0"
boto3-stubs = { extras = ["s3"], version = "^1.35.0" }
python-dotenv = "^1.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "scripts"]
mypy_path = "."
explicit_package_bases = true
